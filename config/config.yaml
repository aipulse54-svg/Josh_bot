# LLM Training Configuration

# Model Configuration
model:
  name: "meta-llama/Llama-2-7b-hf"  # or gpt2, distilbert-base-uncased for lighter models
  model_type: "causal_lm"  # causal_lm, seq2seq, masked_lm
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  intermediate_size: 11008
  max_position_embeddings: 4096
  vocab_size: 32000

# Training Configuration
training:
  output_dir: "./outputs/checkpoint"
  num_train_epochs: 3
  per_device_train_batch_size: 4  # Adjust based on GPU memory
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42
  fp16: true  # Mixed precision training
  logging_steps: 100
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  resume_from_checkpoint: null

# Dataset Configuration
dataset:
  train_dataset: "codeparrot/codeparrot"
  val_dataset: "codeparrot/codeparrot-valid"
  math_dataset: "hendrycks/competition_math"
  max_seq_length: 2048
  preprocessing_num_workers: 4
  overwrite_cache: false

# LoRA Configuration (For efficient fine-tuning)
lora:
  enabled: true
  r: 8
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Quantization Configuration (For memory efficiency)
quantization:
  enabled: false
  load_in_8bit: false
  load_in_4bit: false
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true

# Inference Configuration
inference:
  max_length: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.0
  num_beams: 1

# Logging & Monitoring
logging:
  use_wandb: true
  project_name: "llm-assistant"
  entity: "aipulse54-svg"
  log_model: true
  log_frequency: 100
